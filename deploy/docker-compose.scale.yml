x-node-base: &node-base
  build:
    context: ..
    dockerfile: Dockerfile
  image: sdcc-node:local
  command: ["--config", "/config/config.yaml"]
  networks:
    - sdcc-net
  restart: unless-stopped

services:
  node1:
    <<: *node-base
    volumes:
      - ../configs/node1.yaml:/config/config.yaml:ro
      - node1-state:/var/lib/sdcc

  node2:
    <<: *node-base
    volumes:
      - ../configs/node2.yaml:/config/config.yaml:ro
      - node2-state:/var/lib/sdcc

  node3:
    <<: *node-base
    volumes:
      - ../configs/node3.yaml:/config/config.yaml:ro
      - node3-state:/var/lib/sdcc

  node4:
    <<: *node-base
    volumes:
      - ../configs/node4.yaml:/config/config.yaml:ro
      - node4-state:/var/lib/sdcc

  node5:
    <<: *node-base
    volumes:
      - ../configs/node5.yaml:/config/config.yaml:ro
      - node5-state:/var/lib/sdcc

  node6:
    <<: *node-base
    volumes:
      - ../configs/node6.yaml:/config/config.yaml:ro
      - node6-state:/var/lib/sdcc

networks:
  sdcc-net:
    name: sdcc-net
    driver: bridge

volumes:
  node1-state:
  node2-state:
  node3-state:
  node4-state:
  node5-state:
  node6-state:
